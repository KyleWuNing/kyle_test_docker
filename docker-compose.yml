version: '3.8'

services:
  # 1. MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: local-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: local_db
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # 2. Redis 缓存
  redis:
    image: redis:7.0-alpine
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 3. Kafka (使用 KRaft 模式，不需要额外安装 Zookeeper，更轻量高效)
  # PLAINTEXT://localhost:9092      — for host-machine clients (host port mapping)
  # PLAINTEXT_INTERNAL://local-kafka:29092 — for Docker-to-Docker clients (e.g. CMS)
  kafka:
    image: apache/kafka:latest
    container_name: local-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://local-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: always

  # 4. PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: local-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: local_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 5. LiteLLM proxy
  litellm:
    image: litellm/litellm:latest
    container_name: local-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      DATABASE_URL: postgresql://postgres:root@postgres:5432/local_db
      LITELLM_MASTER_KEY: sk-local-master-key
      UI_USERNAME: admin
      UI_PASSWORD: admin
      OPENAI_API_KEY: sk-dummy-openai-key
      ANTHROPIC_API_KEY: sk-dummy-anthropic-key
      GEMINI_API_KEY: dummy-gemini-key
      DEEPSEEK_API_KEY: sk-dummy-deepseek-key
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # 6. Redis Cluster (3 masters + 3 replicas)
  redis-node-1:
    image: redis:7.0-alpine
    container_name: redis-node-1
    ports:
      - "7001:7001"
      - "17001:17001"
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip redis-node-1
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
    volumes:
      - redis_cluster_data_1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: always

  redis-node-2:
    image: redis:7.0-alpine
    container_name: redis-node-2
    ports:
      - "7002:7002"
      - "17002:17002"
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip redis-node-2
      --cluster-announce-port 7002
      --cluster-announce-bus-port 17002
    volumes:
      - redis_cluster_data_2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: always

  redis-node-3:
    image: redis:7.0-alpine
    container_name: redis-node-3
    ports:
      - "7003:7003"
      - "17003:17003"
    command: >
      redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip redis-node-3
      --cluster-announce-port 7003
      --cluster-announce-bus-port 17003
    volumes:
      - redis_cluster_data_3:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: always

  redis-node-4:
    image: redis:7.0-alpine
    container_name: redis-node-4
    ports:
      - "7004:7004"
      - "17004:17004"
    command: >
      redis-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip redis-node-4
      --cluster-announce-port 7004
      --cluster-announce-bus-port 17004
    volumes:
      - redis_cluster_data_4:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: always

  redis-node-5:
    image: redis:7.0-alpine
    container_name: redis-node-5
    ports:
      - "7005:7005"
      - "17005:17005"
    command: >
      redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip redis-node-5
      --cluster-announce-port 7005
      --cluster-announce-bus-port 17005
    volumes:
      - redis_cluster_data_5:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: always

  redis-node-6:
    image: redis:7.0-alpine
    container_name: redis-node-6
    ports:
      - "7006:7006"
      - "17006:17006"
    command: >
      redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip redis-node-6
      --cluster-announce-port 7006
      --cluster-announce-bus-port 17006
    volumes:
      - redis_cluster_data_6:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7006", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: always

  # Initialize the cluster after all nodes are healthy (skip if already initialized)
  redis-cluster-init:
    image: redis:7.0-alpine
    container_name: redis-cluster-init
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    entrypoint: []
    command: >
      sh -c "redis-cli -h redis-node-1 -p 7001 cluster info 2>/dev/null | grep -q cluster_state:ok &&
      echo 'Cluster already initialized, skipping...' ||
      (echo 'Initializing Redis Cluster...' &&
      redis-cli --cluster create
      redis-node-1:7001 redis-node-2:7002 redis-node-3:7003
      redis-node-4:7004 redis-node-5:7005 redis-node-6:7006
      --cluster-replicas 1 --cluster-yes)"
    restart: "no"

volumes:
  mysql_data:
  redis_data:
  postgres_data:
  redis_cluster_data_1:
  redis_cluster_data_2:
  redis_cluster_data_3:
  redis_cluster_data_4:
  redis_cluster_data_5:
  redis_cluster_data_6: