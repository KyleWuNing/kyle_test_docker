version: "3.9"

# CMS deployment — reuses all infrastructure from docker-compose.yml.
#
# Prerequisites:
#   1. Build the fat JAR:
#        cd /Users/kylewu/IdeaProjects/cost-management && mvn package -DskipTests
#   2. Start the base stack (first time or after Kafka config change, recreate Kafka):
#        docker-compose up -d --force-recreate kafka
#        docker-compose up -d
#   3. Create the CMS database in MySQL (one-time):
#        docker exec -it local-mysql mysql -u root -proot -e \
#          "CREATE DATABASE IF NOT EXISTS moon_cake CHARACTER SET utf8mb4;"
#   4. Start CMS:
#        docker-compose -f docker-compose.yml -f docker-compose.cms.yml up -d cms
#
# LiteLLM master key:  sk-local-master-key  (from docker-compose.yml)
# CMS admin API key:   cms-admin-key-local   (set below, use in Authorization: Bearer header)

services:
  cms:
    build:
      context: /Users/kylewu/IdeaProjects/cost-management
      dockerfile: src/main/docker/Dockerfile
      args:
        JAR_FILE: target/cost-management-service-1.0.0-SNAPSHOT-exec.jar
    container_name: local-cms
    ports:
      - "19000:19000"
    volumes:
      - /Users/kylewu/IdeaProjects/cost-management/logs:/app/logs
    environment:
      # ── Server port ────────────────────────────────────────────────────────
      MOONCAKE_PORT: 19000
      # ── Database (MySQL local-mysql) ──────────────────────────────────────
      DB_HOST: local-mysql
      DB_PORT: 3306
      DB_NAME: moon_cake
      DB_USER: root
      DB_PASSWORD: root
      # Use 'update' to auto-create/update tables (including kafka_event from EB common library)
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # ── Quartz scheduler (same MySQL as main DB) ──────────────────────────
      QUARTZ_DB_HOST: local-mysql
      QUARTZ_DB_PORT: 3306
      QUARTZ_DB_NAME: eb_quartz
      QUARTZ_DB_USERNAME: root
      QUARTZ_DB_PASSWORD: root
      # Enable Quartz scheduler — must be one of [billing, payment, integration]
      YTY_SCHEDULER_OWNER: billing

      # ── Kafka (internal listener for Docker-to-Docker) ────────────────────
      KAFKA_SERVER: local-kafka:29092

      # ── LiteLLM (local-litellm) ───────────────────────────────────────────
      LITELLM_BASE_URL: http://local-litellm:4000
      LITELLM_MASTER_KEY: sk-local-master-key
      # Master key doubles as virtual key for local testing
      LITELLM_VIRTUAL_KEY: sk-local-master-key

      # ── CMS admin security ────────────────────────────────────────────────
      ADMIN_API_KEY: cms-admin-key-local

      # ── Redis (required by EB common AuthCacheService) ─────────────────────
      # Standalone mode (default):
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-local-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      # Cluster mode — set REDIS_MODE=cluster to activate. When set, SPRING_DATA_REDIS_HOST/PORT
      # are ignored and Spring Boot uses cluster nodes instead.
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-}
      # Spring profile for cluster mode — set to "docker-cluster" when REDIS_MODE=cluster
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}

      # ── BS (Billing Service) API ──────────────────────────────────────────
      BS_API_MODEL_SYNC_ENABLED: ${BS_API_MODEL_SYNC_ENABLED:-false}
      BS_API_USAGE_NOTIFICATION_ENABLED: ${BS_API_USAGE_NOTIFICATION_ENABLED:-false}
      BS_API_USAGE_NOTIFICATION_ENTITY_ID: ${BS_API_USAGE_NOTIFICATION_ENTITY_ID:-}
      BS_API_USAGE_NOTIFICATION_CRON: ${BS_API_USAGE_NOTIFICATION_CRON:-0/30 * * * * ?}
      BS_API_BASE_URL: ${BS_API_BASE_URL:-https://test.api.easybilling.cloud/billing}
      BS_API_KEY: ${BS_API_KEY:-client_api_key_tJ2s1RdmUUP1JZo3CWlTqo9JTIeCXrghFM5hek7z9G2F1cZg2}

      # ── Usage event schema ────────────────────────────────────────────────
      YTY_CMS_USAGE_EVENT_SCHEMA_NAME: ${YTY_CMS_USAGE_EVENT_SCHEMA_NAME:-Cost-Dev}
      YTY_CMS_USAGE_EVENT_SCHEMA_ID: ${YTY_CMS_USAGE_EVENT_SCHEMA_ID:-50186d53-591b-4aa4-9589-77e0e128ba8e}
    restart: unless-stopped
